<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bocage · Squad Combat Simulation</title>
<meta name="description" content="A US rifle platoon attacks a German position in the Normandy hedgerows, June 1944, simulated soldier by soldier: squads bound from hedge to hedge, pin machine guns with fire, flank and assault, while medics work under fire and every wound is tracked part by part.">
<meta name="author" content="Shay Kashif">
<meta name="robots" content="index, follow">
<link rel="canonical" href="https://sim.shaykas.com/squad/">
<meta property="og:title" content="Bocage: Squad Combat Simulation">
<meta property="og:description" content="A US rifle platoon attacks a German position in the Normandy hedgerows, June 1944, simulated soldier by soldier in your browser.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://sim.shaykas.com/squad/">
<meta name="twitter:card" content="summary">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<meta name="theme-color" content="#16180f">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Silkscreen&family=VT323&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #16180f; --panel: #23261a; --panel2: #2e3222; --edge: #535a3a; --ink: #ece6cc; --dim: #a8a888;
    --gold: #e8c84a; --red: #e05a4a; --blue: #6ab0f0; --green: #8ac860; --orange: #f0963a; --purple: #b08ae8;
    --us: #e8d890; --de: #b8d0a8;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 18px/1.15 "VT323", monospace; }
  body { display: grid; grid-template-columns: 1fr 400px; grid-template-rows: 100vh; overflow: hidden; }
  #stage { position: relative; min-width: 0; }
  #world { width: 100%; height: 100%; display: block; image-rendering: pixelated; cursor: grab; touch-action: none; }
  #world.power-artillery, #world.power-smoke, #world.power-sniper { cursor: crosshair; }
  #topbar { position: absolute; left: 12px; top: 12px; right: 12px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; pointer-events: none; }
  #topbar > * { pointer-events: auto; }
  .chip { background: rgba(22,24,15,.92); border: 2px solid var(--edge); padding: 4px 10px; box-shadow: 0 3px 0 #000a; }
  #clock { font-family: "Silkscreen", monospace; font-size: 13px; letter-spacing: .5px; }
  #clock.paused { color: var(--orange); }
  button { font: 16px "VT323", monospace; color: var(--ink); background: var(--panel2); border: 2px solid var(--edge); padding: 2px 8px; cursor: pointer; box-shadow: 0 2px 0 #000a; }
  button:hover { border-color: var(--gold); }
  button.on { background: #5a5a1e; border-color: var(--gold); color: #fff6d8; }
  button.danger.on { background: #6a1e1e; border-color: var(--red); }
  #controls, #powers, #toggles { display: flex; gap: 4px; align-items: center; }
  #help { position: absolute; left: 12px; bottom: 12px; font-size: 15px; color: var(--dim); max-width: calc(100% - 230px); }
  #minimap { position: absolute; right: 12px; bottom: 12px; width: 216px; height: 156px; image-rendering: pixelated; border: 2px solid var(--edge); box-shadow: 0 3px 0 #000a; cursor: pointer; background: #000; }
  #toasts { position: absolute; right: 12px; top: 64px; width: 330px; display: flex; flex-direction: column; gap: 6px; pointer-events: none; }
  .toast { pointer-events: auto; background: rgba(28,30,20,.96); border: 2px solid var(--gold); padding: 8px 10px; box-shadow: 0 4px 0 #000c; animation: pop .2s ease-out; }
  .toast.death { border-color: var(--red); }
  .toast.fire { border-color: var(--orange); }
  .toast.battle { border-color: var(--gold); }
  .toast.squad { border-color: #8a8a70; }
  .toast b { font: 13px "Silkscreen", monospace; display: block; margin-bottom: 3px; }
  @keyframes pop { from { transform: translateX(30px); opacity: 0; } to { transform: none; opacity: 1; } }
  aside { background: var(--panel); border-left: 3px solid var(--edge); display: flex; flex-direction: column; min-height: 0; }
  section { padding: 8px 12px; border-bottom: 2px solid #16180f; }
  h1 { font: 15px "Silkscreen", monospace; margin: 0 0 6px; color: var(--gold); letter-spacing: 1px; }
  h3 { font: 12px "Silkscreen", monospace; margin: 6px 0 4px; color: var(--dim); letter-spacing: 1px; text-transform: uppercase; }
  h4 { font: 12px "Silkscreen", monospace; margin: 8px 0 2px; color: var(--dim); }
  form { display: flex; gap: 4px; }
  input[type=number] { width: 90px; font: 16px "VT323", monospace; background: #101208; color: var(--ink); border: 2px solid var(--edge); padding: 2px 6px; }
  .hbtns { display: flex; gap: 4px; margin: 6px 0 0; }
  .hbtns button { flex: 1; }
  .force { margin: 4px 0; }
  .force .name { display: flex; justify-content: space-between; font-size: 16px; }
  .force .name small { color: var(--dim); }
  .stack { display: flex; height: 10px; border: 1px solid #000; background: #101208; margin-top: 2px; }
  .stack i { display: block; height: 100%; }
  .legend { display: flex; flex-wrap: wrap; gap: 2px 8px; font-size: 13px; color: var(--dim); margin-top: 3px; }
  .legend i { display: inline-block; width: 8px; height: 8px; margin-right: 3px; border: 1px solid #000; }
  #tabs { display: flex; gap: 4px; padding: 6px 12px 0; }
  #tabs button { flex: 1; font-size: 17px; padding: 3px 4px; }
  #tabwrap { flex: 1; min-height: 120px; display: flex; flex-direction: column; padding: 6px 12px; overflow: hidden; }
  .tab { overflow-y: auto; flex: 1; font-size: 16px; display: none; }
  .tab.show { display: block; }
  #men.show { display: flex; flex-direction: column; }
  #roster { max-height: 150px; overflow-y: auto; flex: none; border-bottom: 2px solid #16180f; padding-bottom: 4px; font-size: 15px; }
  #roster .sq { margin: 2px 0; }
  #roster .sq b { font: 11px "Silkscreen", monospace; }
  #roster a { border: 0; margin-right: 6px; white-space: nowrap; }
  #roster a.sel { color: var(--gold); text-decoration: underline; }
  #roster a.gone { color: #6a6a58; text-decoration: line-through; }
  #roster a.hurt { color: #f0a090; }
  #inspector { flex: 1; overflow-y: auto; min-height: 0; margin-top: 6px; padding-right: 4px; }
  a { color: var(--ink); text-decoration: none; border-bottom: 1px dotted var(--dim); cursor: pointer; }
  a:hover { color: var(--gold); }
  em.sw { display: inline-block; width: 10px; height: 10px; border: 1px solid #0008; vertical-align: middle; margin-right: 3px; }
  .pp-head { display: flex; gap: 10px; align-items: center; }
  .face { width: 96px; height: 96px; image-rendering: pixelated; border: 3px solid var(--edge); background: #000; flex: none; }
  .pp-head b { font-size: 21px; }
  .pp-head small { display: block; color: var(--dim); }
  .doing { margin: 6px 0; color: var(--gold); }
  .bar { display: grid; grid-template-columns: 86px 1fr; align-items: center; font-size: 15px; }
  .bar i { height: 8px; background: #101208; border: 1px solid #000; display: block; }
  .bar b { display: block; height: 100%; }
  .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 0 10px; }
  .pp-mid { display: flex; gap: 10px; margin: 8px 0; align-items: flex-start; }
  .bodydiag { width: 80px; height: 148px; image-rendering: pixelated; background: #101208; border: 2px solid var(--edge); flex: none; }
  .desc { font-size: 17px; line-height: 1.2; }
  .desc p { margin: 0 0 6px; }
  .wounds { margin: 2px 0 0; padding: 0; list-style: none; font-size: 16px; }
  .wounds .lasting { color: var(--purple); }
  .wounds .wound { color: var(--orange); }
  .wounds .grave { color: var(--red); }
  .traits { font-size: 15px; color: var(--dim); margin-top: 3px; }
  ul.plain { list-style: none; margin: 0; padding: 0; }
  ul.plain li { padding: 1px 0 1px 7px; border-left: 3px solid var(--edge); margin-bottom: 3px; font-size: 15px; }
  time { color: var(--dim); font-size: 14px; }
  .squad { border: 2px solid var(--edge); padding: 6px 8px; margin-bottom: 6px; background: #1c1f14; cursor: pointer; }
  .squad:hover { border-color: var(--gold); }
  .squad .st { font: 11px "Silkscreen", monospace; padding: 0 4px; border: 1px solid var(--edge); margin-left: 4px; }
  .squad .intent { color: var(--gold); margin: 2px 0; }
  .squad .men { font-size: 15px; color: var(--dim); }
  .side-h { font: 12px "Silkscreen", monospace; color: var(--dim); margin: 8px 0 4px; }
  .l-us { border-color: #8a8048 !important; }
  .l-de { border-color: #6a8a5a !important; }
  .l-death { border-color: #888 !important; }
  .l-wound { border-color: var(--red) !important; }
  .l-order { border-color: var(--blue) !important; }
  .l-voice { border-color: #555 !important; color: #d8d0b8; font-style: italic; }
  .l-medic { border-color: #e0e0e0 !important; }
  .l-fire { border-color: var(--orange) !important; }
  .l-battle { border-color: var(--gold) !important; }
  #chronicle { position: absolute; left: 12px; top: 96px; bottom: 56px; width: 310px; display: flex; flex-direction: column; justify-content: flex-end; pointer-events: none; overflow: hidden;
    -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 35%); mask-image: linear-gradient(to bottom, transparent 0, #000 35%); }
  #chronicle.hidden { display: none; }
  #feed { list-style: none; margin: 0; padding: 0; font-size: 16px; text-shadow: 0 1px 2px #000, 0 0 3px #000, 1px 1px 0 #000; }
  #feed li { padding: 1px 0 1px 7px; border-left: 3px solid var(--edge); margin-bottom: 3px; color: #fff4dc; }
  #feed a { pointer-events: auto; color: #fff4dc; }
  #feed time { color: #d8c8a8; }
  #modal { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: none; align-items: center; justify-content: center; z-index: 10; }
  #modal.open { display: flex; }
  #modal .box { background: var(--panel); border: 3px solid var(--gold); width: min(820px, 94vw); max-height: 88vh; display: flex; flex-direction: column; box-shadow: 0 6px 0 #000c; }
  #modal header { display: flex; align-items: center; justify-content: space-between; padding: 10px 14px; border-bottom: 2px solid var(--edge); }
  #modal header h2 { font: 16px "Silkscreen", monospace; color: var(--gold); margin: 0; }
  #modal .body { overflow-y: auto; padding: 10px 14px; font-size: 18px; }
  table.aar { border-collapse: collapse; width: 100%; font-size: 17px; margin: 6px 0 10px; }
  table.aar td, table.aar th { padding: 2px 8px; border-bottom: 1px solid var(--edge); text-align: left; }
  table.aar th { font: 11px "Silkscreen", monospace; color: var(--dim); }
  .verdict { font-size: 24px; color: var(--gold); margin: 4px 0 8px; }
  .hint { color: var(--dim); margin: 0; }
  @media (max-width: 900px) {
    body { grid-template-columns: 1fr; grid-template-rows: 62vh auto; overflow: auto; }
    aside { border-left: 0; border-top: 3px solid var(--edge); min-height: 70vh; }
    #chronicle, #help { display: none; }
    #minimap { width: 120px; height: 87px; }
    #toasts { width: auto; left: 12px; }
  }
</style>
</head>
<body>
  <noscript><h1>Bocage</h1><p>A squad-level infantry battle in the Normandy hedgerows, June 1944, simulated in your browser. This page needs JavaScript.</p></noscript>
  <div id="stage">
    <canvas id="world"></canvas>
    <div id="topbar">
      <div class="chip" id="clock">loading</div>
      <div class="chip" id="controls">
        <button id="pause" title="Pause (space)">⏸</button>
        <button id="step" title="Ten seconds on">⏭</button>
        <span id="speeds"></span>
      </div>
      <div class="chip" id="toggles">
        <button data-toggle="roofs" title="Roofs (R)">Roofs</button>
        <button data-toggle="names" title="Names (N)">Names</button>
        <button data-toggle="orders" title="Squad orders: where each man is sent, what is being suppressed (O)">Orders</button>
        <button data-toggle="sight" title="Who the selected man can see (V)">Sight</button>
        <button data-toggle="chronicle" title="Battle log overlay (C)">Log</button>
      </div>
      <div class="chip" id="powers">
        <button data-power="inspect" title="Inspect (I)">🔍</button>
        <button data-power="artillery" class="danger" title="Call a 105 mm barrage anywhere (X)">💥 Barrage</button>
        <button data-power="smoke" class="danger" title="Lay a smoke screen (Z)">💨 Smoke</button>
        <button data-power="sniper" class="danger" title="A shot from an unseen sniper (K)">🎯 Sniper</button>
      </div>
    </div>
    <div id="chronicle"><ul id="feed"></ul></div>
    <div id="toasts"></div>
    <canvas id="minimap" title="Click to look there"></canvas>
    <div id="help" class="chip">drag to pan · wheel to zoom · click a soldier · WASD pan · Q/E zoom · space pause · 1–6 speed · F follow · hover a house to look inside</div>
  </div>
  <aside>
    <section>
      <h1>⚔ BOCAGE · <span id="date">12 JUNE 1944</span></h1>
      <form id="seedform"><input id="seed" type="number" min="1" value="42"><button type="submit">New battle</button><button type="button" id="random" title="Random seed">🎲</button></form>
      <div id="forces"></div>
      <div class="hbtns"><button id="book" title="The whole battle log (B)">📖 Log</button><button id="reportbtn" title="After-action report">📋 Report</button></div>
    </section>
    <div id="tabs">
      <button data-tab="men" class="on">🪖 Men</button>
      <button data-tab="squads">🗺 Squads</button>
      <button data-tab="events">📜 Events</button>
    </div>
    <div id="tabwrap">
      <div class="tab show" id="men"><div id="roster"></div><div id="inspector"></div></div>
      <div class="tab" id="squads"></div>
      <ul class="tab plain" id="events"></ul>
    </div>
  </aside>
  <div id="modal"><div class="box"><header><h2 id="mtitle">Report</h2><button id="mclose">✕ close</button></header><div class="body" id="mbody"></div></div></div>
  <script src="dist/viewer.js"></script>
</body>
</html>
