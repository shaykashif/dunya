<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bocage · Squad Combat Simulation</title>
<meta name="description" content="A US rifle platoon attacks a German position in the Normandy hedgerows, June 1944, simulated soldier by soldier: squads bound from hedge to hedge, pin machine guns with fire, flank and assault, while medics work under fire and every wound is tracked part by part.">

<link href="https://fonts.googleapis.com/css2?family=Silkscreen&family=VT323&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #16180f; --panel: #23261a; --panel2: #2e3222; --edge: #535a3a; --ink: #ece6cc; --dim: #a8a888;
    --gold: #e8c84a; --red: #e05a4a; --blue: #6ab0f0; --green: #8ac860; --orange: #f0963a; --purple: #b08ae8;
    --us: #e8d890; --de: #b8d0a8;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 18px/1.15 "VT323", monospace; }
  body { display: grid; grid-template-columns: 1fr 400px; grid-template-rows: 100vh; overflow: hidden; }
  #stage { position: relative; min-width: 0; }
  #world { width: 100%; height: 100%; display: block; image-rendering: pixelated; cursor: grab; touch-action: none; }
  #world.power-artillery, #world.power-smoke, #world.power-sniper { cursor: crosshair; }
  #topbar { position: absolute; left: 12px; top: 12px; right: 12px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; pointer-events: none; }
  #topbar > * { pointer-events: auto; }
  .chip { background: rgba(22,24,15,.92); border: 2px solid var(--edge); padding: 4px 10px; box-shadow: 0 3px 0 #000a; }
  a.homelink { color: var(--ink); text-decoration: none; font-size: 17px; white-space: nowrap; }
  a.homelink:hover { border-color: var(--gold); }
  #clock { font-family: "Silkscreen", monospace; font-size: 13px; letter-spacing: .5px; }
  #clock.paused { color: var(--orange); }
  button { font: 16px "VT323", monospace; color: var(--ink); background: var(--panel2); border: 2px solid var(--edge); padding: 2px 8px; cursor: pointer; box-shadow: 0 2px 0 #000a; }
  button:hover { border-color: var(--gold); }
  button.on { background: #5a5a1e; border-color: var(--gold); color: #fff6d8; }
  button.danger.on { background: #6a1e1e; border-color: var(--red); }
  #controls, #powers, #toggles { display: flex; gap: 4px; align-items: center; }
  #powers kbd { font: 11px "Silkscreen", monospace; margin-left: 4px; padding: 1px 4px; color: var(--gold); border: 1px solid var(--edge); background: rgba(0,0,0,.35); }
  #powers { position: absolute; left: 12px; bottom: 44px; z-index: 5; }
  #help { position: absolute; left: 12px; bottom: 12px; font-size: 15px; color: var(--dim); max-width: calc(100% - 256px); }
  #minimap { position: absolute; right: 12px; bottom: 34px; height: 200px; width: auto; max-width: 216px; image-rendering: pixelated; border: 2px solid var(--edge); box-shadow: 0 3px 0 #000a; cursor: pointer; background: #000; }
  #gridref { position: absolute; right: 12px; bottom: 10px; width: 220px; box-sizing: border-box; padding: 2px 6px; font: 10px "Silkscreen", monospace; color: var(--dim); background: rgba(20,22,14,.9); border: 2px solid var(--edge); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; pointer-events: none; }
  #toasts { position: absolute; right: 12px; top: 64px; width: 280px; display: flex; flex-direction: column; gap: 6px; pointer-events: none; }
  .toast { pointer-events: auto; background: rgba(28,30,20,.96); border: 2px solid var(--gold); padding: 5px 8px; font-size: 15px; box-shadow: 0 4px 0 #000c; animation: pop .2s ease-out; }
  .toast.death { border-color: var(--red); }
  .toast.fire { border-color: var(--orange); }
  .toast.battle { border-color: var(--gold); }
  .toast.squad { border-color: #8a8a70; }
  .toast b { font: 11px "Silkscreen", monospace; display: block; margin-bottom: 2px; }
  @keyframes pop { from { transform: translateX(30px); opacity: 0; } to { transform: none; opacity: 1; } }
  body.side-hidden { grid-template-columns: 1fr; }
  body.side-hidden aside { display: none; }
  #sidetoggle { position: absolute; right: 12px; top: 12px; z-index: 8; width: 34px; height: 34px; padding: 0; display: grid; place-items: center; }
  #sidetoggle .px { height: 20px; }
  aside { background: var(--panel); border-left: 3px solid var(--edge); display: flex; flex-direction: column; min-height: 0; }
  section { padding: 8px 12px; border-bottom: 2px solid #16180f; }
  h1 { font: 15px "Silkscreen", monospace; margin: 0 0 6px; color: var(--gold); letter-spacing: 1px; }
  h3 { font: 12px "Silkscreen", monospace; margin: 6px 0 4px; color: var(--dim); letter-spacing: 1px; text-transform: uppercase; }
  h4 { font: 12px "Silkscreen", monospace; margin: 8px 0 2px; color: var(--dim); }
  form { display: flex; gap: 4px; }
  input[type=number] { width: 90px; font: 16px "VT323", monospace; background: #101208; color: var(--ink); border: 2px solid var(--edge); padding: 2px 6px; }
  .hbtns { display: flex; gap: 4px; margin: 6px 0 0; }
  .hbtns button { flex: 1; }
  .force { margin: 4px 0; }
  .force .name { display: flex; justify-content: space-between; font-size: 16px; }
  .force .name small { color: var(--dim); }
  .stack { display: flex; height: 10px; border: 1px solid #000; background: #101208; margin-top: 2px; }
  .stack i { display: block; height: 100%; }
  .legend { display: flex; flex-wrap: wrap; gap: 2px 8px; font-size: 13px; color: var(--dim); margin-top: 3px; }
  .legend i { display: inline-block; width: 8px; height: 8px; margin-right: 3px; border: 1px solid #000; }
  #tabs { display: flex; gap: 4px; padding: 6px 12px 0; }
  #tabs button { flex: 1; font-size: 17px; padding: 3px 4px; }
  #tabwrap { flex: 1; min-height: 120px; display: flex; flex-direction: column; padding: 6px 12px; overflow: hidden; }
  .tab { overflow-y: auto; flex: 1; font-size: 16px; display: none; }
  .tab.show { display: block; }
  #men.show { display: flex; flex-direction: column; }
  #roster { max-height: 150px; overflow-y: auto; flex: none; border-bottom: 2px solid #16180f; padding-bottom: 4px; font-size: 15px; }
  #roster .sq { margin: 2px 0; }
  #roster .sq b { font: 11px "Silkscreen", monospace; }
  #roster a { border: 0; margin-right: 6px; white-space: nowrap; }
  #roster a.sel { color: var(--gold); text-decoration: underline; }
  #roster a.gone { color: #6a6a58; text-decoration: line-through; }
  #roster a.hurt { color: #f0a090; }
  #inspector { flex: 1; overflow-y: auto; min-height: 0; margin-top: 6px; padding-right: 4px; }
  a { color: var(--ink); text-decoration: none; border-bottom: 1px dotted var(--dim); cursor: pointer; }
  a:hover { color: var(--gold); }
  em.sw { display: inline-block; width: 10px; height: 10px; border: 1px solid #0008; vertical-align: middle; margin-right: 3px; }
  .pp-head { display: flex; gap: 10px; align-items: center; }
  .face { width: 96px; height: 96px; image-rendering: pixelated; border: 3px solid var(--edge); background: #000; flex: none; }
  .pp-head b { font-size: 21px; }
  .pp-head small { display: block; color: var(--dim); }
  .doing { margin: 6px 0; color: var(--gold); }
  .bar { display: grid; grid-template-columns: 86px 1fr; align-items: center; font-size: 15px; }
  .bar i { height: 8px; background: #101208; border: 1px solid #000; display: block; }
  .bar b { display: block; height: 100%; }
  .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 0 10px; }
  .pp-mid { display: flex; gap: 10px; margin: 8px 0; align-items: flex-start; }
  .bodydiag { width: 80px; height: 148px; image-rendering: pixelated; background: #101208; border: 2px solid var(--edge); flex: none; }
  .desc { font-size: 17px; line-height: 1.2; }
  .desc p { margin: 0 0 6px; }
  .wounds { margin: 2px 0 0; padding: 0; list-style: none; font-size: 16px; }
  .wounds .lasting { color: var(--purple); }
  .wounds .wound { color: var(--orange); }
  .wounds .grave { color: var(--red); }
  .traits { font-size: 15px; color: var(--dim); margin-top: 3px; }
  ul.plain { list-style: none; margin: 0; padding: 0; }
  ul.plain li { padding: 1px 0 1px 7px; border-left: 3px solid var(--edge); margin-bottom: 3px; font-size: 15px; }
  time { color: var(--dim); font-size: 14px; }
  .squad { border: 2px solid var(--edge); padding: 6px 8px; margin-bottom: 6px; background: #1c1f14; cursor: pointer; }
  .squad:hover { border-color: var(--gold); }
  .squad .st { font: 11px "Silkscreen", monospace; padding: 0 4px; border: 1px solid var(--edge); margin-left: 4px; }
  .squad .intent { color: var(--gold); margin: 2px 0; }
  .squad .men { font-size: 15px; color: var(--dim); }
  .side-h { font: 12px "Silkscreen", monospace; color: var(--dim); margin: 8px 0 4px; }
  .l-us { border-color: #8a8048 !important; }
  .l-de { border-color: #6a8a5a !important; }
  .l-death { border-color: #888 !important; }
  .l-wound { border-color: var(--red) !important; }
  .l-order { border-color: var(--blue) !important; }
  .l-voice { border-color: #555 !important; color: #d8d0b8; font-style: italic; }
  .l-medic { border-color: #e0e0e0 !important; }
  .l-fire { border-color: var(--orange) !important; }
  .l-battle { border-color: var(--gold) !important; }
  #chronicle { position: absolute; left: 12px; top: 96px; bottom: 96px; width: 310px; display: flex; flex-direction: column; justify-content: flex-end; pointer-events: none; overflow: hidden;
    -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 35%); mask-image: linear-gradient(to bottom, transparent 0, #000 35%); }
  #chronicle.hidden { display: none; }
  #feed { list-style: none; margin: 0; padding: 0; font-size: 16px; text-shadow: 0 1px 2px #000, 0 0 3px #000, 1px 1px 0 #000; }
  #feed li { padding: 1px 0 1px 7px; border-left: 3px solid var(--edge); margin-bottom: 3px; color: #fff4dc; }
  #feed a { pointer-events: auto; color: #fff4dc; }
  #feed time { color: #d8c8a8; }
  #modal { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: none; align-items: center; justify-content: center; z-index: 10; }
  #modal.open { display: flex; }
  #modal .box { background: var(--panel); border: 3px solid var(--gold); width: min(820px, 94vw); max-height: 88vh; display: flex; flex-direction: column; box-shadow: 0 6px 0 #000c; }
  #modal header { display: flex; align-items: center; justify-content: space-between; padding: 10px 14px; border-bottom: 2px solid var(--edge); }
  #modal header h2 { font: 16px "Silkscreen", monospace; color: var(--gold); margin: 0; flex: 1; }
  #modal header { gap: 8px; }
  #modal .body { overflow-y: auto; padding: 10px 14px; font-size: 18px; }
  table.aar { border-collapse: collapse; width: 100%; font-size: 17px; margin: 6px 0 10px; }
  table.aar td, table.aar th { padding: 2px 8px; border-bottom: 1px solid var(--edge); text-align: left; }
  table.aar th { font: 10px "Silkscreen", monospace; color: var(--dim); }
  .verdict { font-size: 24px; color: var(--gold); margin: 4px 0 8px; }
  .hint { color: var(--dim); margin: 0; }
  @media (max-width: 900px) {
    /* Map pinned on top, controls and panel in a scrolling sheet below; nothing scrolls the page itself. */
    body { grid-template-columns: 1fr; grid-template-rows: minmax(0, 1fr) 42vh; grid-template-rows: minmax(0, 1fr) 42dvh; height: 100vh; height: 100dvh; overflow: hidden; }
    body.side-hidden { grid-template-rows: minmax(0, 1fr); }
    html, body { overscroll-behavior: none; }
    button { min-height: 40px; min-width: 40px; padding: 4px 10px; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
    aside { border-left: 0; border-top: 3px solid var(--edge); min-height: 0; overflow-y: auto; overscroll-behavior: contain; padding-bottom: env(safe-area-inset-bottom); }
    section { padding: 6px 10px; }
    #chronicle, #help, #gridref, #vol { display: none; }

    /* One scrolling toolbar row; the panel toggle sits in it instead of floating over it. */
    #topbar { left: 0; right: 0; top: 0; padding: 6px 8px; gap: 6px; flex-wrap: wrap; pointer-events: none; background: linear-gradient(rgba(22,24,15,.7), transparent); }
    #topbar > * { flex: none; }
    #clock { font-size: 11px; flex: 1 1 0; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #controls { flex-wrap: wrap; }
    #controls button { min-width: 36px; padding: 4px 6px; }
    #toggles { max-width: 100%; overflow-x: auto; scrollbar-width: none; }
    #toggles::-webkit-scrollbar { display: none; }
    #sidetoggle { position: static; width: 40px; height: 40px; }
    .chip { padding: 2px 6px; }
    #controls, #powers, #toggles { gap: 4px; }

    /* Battlefield powers are the main action: keep them in thumb reach along the bottom edge. */
    #powers { position: absolute; left: 8px; bottom: calc(8px + env(safe-area-inset-bottom)); }
    #powers button { padding: 4px 8px; }
    #minimap { top: auto; right: 8px; bottom: calc(64px + env(safe-area-inset-bottom)); height: 84px; max-width: 150px; }
    #toasts { left: 8px; right: calc(var(--mm-w, 100px) + 16px); top: auto; bottom: calc(64px + env(safe-area-inset-bottom)); max-height: 84px; overflow: hidden; width: auto; flex-direction: column-reverse; gap: 3px; }
    .toast { padding: 2px 6px; font-size: 14px; line-height: 1.05; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; box-shadow: 0 2px 0 #000c; }
    .toast b { display: inline; font-size: 11px; margin: 0 6px 0 0; }
    #stage #cine { bottom: calc(66px + env(safe-area-inset-bottom)); max-width: 92%; font-size: 17px; }

    /* Panel: bigger tabs, rosters and links that a thumb can hit. */
    #seedform input[type=number] { flex: 1; min-width: 0; width: auto; height: 40px; font-size: 18px; }
    #tabs { position: sticky; top: 0; z-index: 2; background: var(--panel); padding: 6px 10px; }
    #tabs button { font-size: 18px; }
    #tabwrap { flex: none; min-height: 0; overflow: visible; padding: 6px 10px; }
    .tab { overflow: visible; }
    #roster { max-height: 120px; }
    #roster a { display: inline-block; padding: 6px 4px; margin-right: 4px; }
    #inspector { overflow: visible; }
    .face { width: 72px; height: 72px; }
    .cols { grid-template-columns: 1fr; }
    #modal .box { width: 100vw; max-height: 100dvh; height: 100dvh; border-width: 0; }
    #modal .body { font-size: 17px; }
    table.aar { font-size: 15px; }
  }
  #quick { display: none; position: fixed; left: 12px; right: 12px; bottom: 12px; max-width: 360px; z-index: 20; bottom: calc(64px + env(safe-area-inset-bottom)); background: rgba(22,24,15,.96); border: 2px solid var(--edge); padding: 8px 10px; box-shadow: 0 0 0 2px #000a; }
  #quick.open { display: block; }
  #quick b { display: block; font-size: 20px; }
  #quick small { display: block; color: var(--dim); }
  .qbtns { display: flex; gap: 8px; margin-top: 8px; }
  #bolts { position: absolute; inset: 0; overflow: hidden; pointer-events: none; z-index: 6; }
  .bolt { position: absolute; width: 26px; height: 30px; margin: -15px 0 0 -13px; padding: 0; display: grid; place-items: center; background: rgba(22,24,15,.94); border: 2px solid #f2c84a; box-shadow: 0 0 0 2px #000a, 0 0 10px #ffe070aa; cursor: pointer; pointer-events: auto; animation: boltpulse .9s ease-in-out infinite; }
  .bolt .px { height: 20px; }
  .bolt.old { border-color: #8a8a70; box-shadow: 0 0 0 2px #000a; animation: none; opacity: .75; }
  .bolt.edge::after { content: ""; position: absolute; inset: -6px; border: 2px dashed #ffe070; }
  .blast { position: absolute; width: 26px; height: 30px; margin: -15px 0 0 -13px; padding: 0; display: grid; place-items: center; background: rgba(22,24,15,.94); border: 2px solid #ff8a30; box-shadow: 0 0 0 2px #000a, 0 0 10px #ff8a30aa; pointer-events: none; animation: blastflash .5s steps(2, end) infinite; }
  .blast .px { height: 20px; }
  .blast.edge { border-color: #ffe070; box-shadow: 0 0 0 2px #000a, 0 0 10px #ffe070aa; }
  .blast.edge::after { content: ""; position: absolute; inset: -6px; border: 2px dashed #ffe070; }
  @keyframes blastflash { 0% { transform: scale(1); opacity: 1; } 100% { transform: scale(1.18); opacity: .6; } }
  @keyframes boltpulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.18); } }
  #cine { position: absolute; left: 50%; bottom: 74px; transform: translateX(-50%); z-index: 7; background: rgba(12,14,8,.92); border: 2px solid #f2c84a; padding: 6px 14px; font-size: 20px; color: #ffe9a0; letter-spacing: .5px; pointer-events: none; display: none; text-align: center; max-width: 80%; }
  #cine small { display: block; color: #bdb89a; font-size: 15px; }
  .pxi { display: inline-block; line-height: 0; vertical-align: -0.18em; }
  .px { height: 1.05em; width: auto; image-rendering: pixelated; }
  button .px { height: 1.15em; }
</style>
</head>
<body>
  <noscript><h1>Bocage</h1><p>A squad-level infantry battle in the Normandy hedgerows, June 1944, simulated in your browser. This page needs JavaScript.</p></noscript>
  <div id="stage">
    <canvas id="world"></canvas>
    <div id="topbar">
      <button id="sidetoggle" title="Hide or show the side panel (H)"><i data-icon="panel"></i></button>
      <a class="chip homelink" href="/" title="Back to the simulation list">&#8962; Home</a>
      <div class="chip" id="clock">loading</div>
      <div class="chip" id="controls">
        <button id="pause" title="Pause (space)"><i data-icon="pause"></i></button>
        <button id="step" title="Ten seconds on"><i data-icon="step"></i></button>
        <span id="speeds"></span>
        <button id="sound" title="Sound on / off (M)"><i data-icon="sound"></i></button>
        <input id="vol" type="range" min="0" max="100" value="70" title="Volume" aria-label="Volume">
      </div>
      <div class="chip" id="toggles">
        <button data-toggle="roofs" title="Roofs (R)">Roofs</button>
        <button data-toggle="names" title="Names (N)">Names</button>
        <button data-toggle="orders" title="Squad orders: where each man is sent, what is being suppressed (O)">Orders</button>
        <button data-toggle="sight" title="Who the selected man can see (V)">Sight</button>
        <button data-toggle="chronicle" title="Battle log overlay (C)">Log</button>
      </div>
    </div>
    <div class="chip" id="powers">
      <button data-power="inspect" title="Inspect (I)"><i data-icon="inspect"></i></button>
      <button data-power="artillery" class="danger" title="Call a 105 mm barrage anywhere (X)"><i data-icon="barrage"></i> Barrage <kbd>X</kbd></button>
      <button data-power="smoke" class="danger" title="Lay a smoke screen (Z)"><i data-icon="smoke"></i> Smoke <kbd>Z</kbd></button>
      <button data-power="sniper" class="danger" title="A shot from an unseen sniper (K)"><i data-icon="sniper"></i> Sniper <kbd>K</kbd></button>
    </div>
    <div id="chronicle"><ul id="feed"></ul></div>
    <div id="toasts"></div>
    <canvas id="minimap" title="Click to look there"></canvas>
    <div id="gridref">Grid —</div>
    <div id="help" class="chip">drag to pan · wheel to zoom · click a soldier · WASD pan · Q/E zoom · space pause · 1–6 speed · M sound · F follow · hover a house to look inside</div>
  </div>
  <aside>
    <section>
      <h1><i data-icon="swords"></i> BOCAGE · <span id="date">12 JUNE 1944</span></h1>
      <form id="seedform"><input id="seed" type="number" min="1" value="1"><button type="submit" title="Run this seed again from the start">Resimulate</button><button type="button" id="random" title="Random seed"><i data-icon="dice"></i></button></form>
      <div id="forces"></div>
      <div class="hbtns"><button id="book" title="The whole battle log (B)"><i data-icon="book"></i> Log</button><button id="reportbtn" title="After-action report"><i data-icon="report"></i> Report</button></div>
    </section>
    <div id="tabs">
      <button data-tab="men" class="on"><i data-icon="helmet"></i> Men</button>
      <button data-tab="squads"><i data-icon="map"></i> Squads</button>
      <button data-tab="events"><i data-icon="scroll"></i> Events</button>
    </div>
    <div id="tabwrap">
      <div class="tab show" id="men"><div id="roster"></div><div id="inspector"></div></div>
      <div class="tab" id="squads"></div>
      <ul class="tab plain" id="events"></ul>
    </div>
  </aside>
  <div id="quick"></div>
  <div id="modal"><div class="box"><header><h2 id="mtitle">Report</h2><button id="mnew" style="display:none"><i data-icon="dice"></i> new battle</button><button id="mclose"><i data-icon="close"></i> close</button></header><div class="body" id="mbody"></div></div></div>
  <script src="dist/viewer.js"></script>
</body>
</html>
