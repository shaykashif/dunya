# nginx site for sim.shaykas.com: a chooser at /, the squad battle viewer at /squad/, the village viewer at /civ/.
# Copy to /etc/nginx/conf.d/sim.shaykas.com.conf.
# The site is served straight from a git clone of the repo at /var/www/dunya;
# `npm run viewer:build` in village/ and in squad/ writes each dist/viewer.js, which runs the whole simulation in the browser.
# `node --no-warnings site/og.ts` regenerates the link-preview images in site/.
# TLS uses the same Cloudflare origin certificate (*.shaykas.com) as the other shaykas.com sites,
# so the `sim` DNS record must be proxied through Cloudflare.
server {
    listen 80;
    listen [::]:80;
    server_name sim.shaykas.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name sim.shaykas.com;

    ssl_certificate     /etc/ssl/cloudflare/shaykas.pem;
    ssl_certificate_key /etc/ssl/cloudflare/shaykas.key;

    root /var/www/dunya/site;
    index index.html;

    # The chooser page and its icon, link-preview images, robots.txt and sitemap; nothing else from site/.
    location = / { try_files /index.html =404; }
    location = /index.html { }
    location = /favicon.svg { }
    location = /robots.txt { }
    location = /sitemap.xml { }
    location ~ ^/og(-squad|-civ|-battle)?\.png$ { }

    # The plain-text page about how the battle simulation works (the one with crawlable content).
    location = /ww2-battle-simulator { return 301 /ww2-battle-simulator/; }
    location = /ww2-battle-simulator/ { try_files /ww2-battle-simulator/index.html =404; }
    # The looping clip on the chooser page.
    location ~ ^/media/battle-(loop\.mp4|poster\.jpg)$ { add_header Cache-Control "public, max-age=86400"; }

    # Anonymous analytics: the viewers post small JSON events here; analytics/collect.ts (systemd: sim-analytics) writes them to disk.
    location = /a/e {
        client_max_body_size 4k;
        limit_except POST { deny all; }
        proxy_pass http://127.0.0.1:5180;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Host $host;
    }

    # The squad combat simulation, from squad/viewer.
    location = /squad { return 301 /squad/; }
    location = /squad/ {
        # Rewrite so the URI no longer ends in "/": the index module would otherwise append index.html to the aliased file.
        root /var/www/dunya/squad/viewer;
        rewrite ^ /index.html break;
    }
    location = /squad/favicon.svg { alias /var/www/dunya/squad/viewer/favicon.svg; }

    # The village (civilization) simulation, from village/viewer.
    location = /civ { return 301 /civ/; }
    location = /civ/ {
        root /var/www/dunya/village/viewer;
        rewrite ^ /index.html break;
    }
    location = /civ/favicon.svg { alias /var/www/dunya/village/viewer/favicon.svg; }
    location = /civ/dist/viewer.js {
        # No hash in the file name, so browsers revalidate after each deploy.
        alias /var/www/dunya/village/viewer/dist/viewer.js;
        add_header Cache-Control "no-cache";
    }

    # The lo-fi sound bank (built by squad/sfx/build.py).
    # The index is always revalidated; the bank is named by its contents, so it can be cached for good.
    location = /squad/audio/bank.json {
        alias /var/www/dunya/squad/viewer/audio/bank.json;
        add_header Cache-Control "no-cache";
    }
    location /squad/audio/ {
        alias /var/www/dunya/squad/viewer/audio/;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location = /squad/dist/viewer.js {
        alias /var/www/dunya/squad/viewer/dist/viewer.js;
        add_header Cache-Control "no-cache";
    }

    location / { return 404; }

    gzip on;
    gzip_types text/javascript application/javascript text/css;
}
