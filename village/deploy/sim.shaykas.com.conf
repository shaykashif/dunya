# nginx site for the village viewer. Copy to /etc/nginx/conf.d/sim.shaykas.com.conf.
# The site is served straight from a git clone of the repo at /var/www/dunya;
# `npm run viewer:build` there writes dist/viewer.js, which runs the whole simulation in the browser.
# certbot --nginx adds the HTTPS server block and the redirect from port 80.
server {
    listen 80;
    listen [::]:80;
    server_name sim.shaykas.com;

    root /var/www/dunya/village/viewer;
    index index.html;

    # Serve only the page and the built bundle, not the sources or build scripts next to them.
    location = / { try_files /index.html =404; }
    location = /index.html { }
    location = /dist/viewer.js {
        # No hash in the file name, so browsers revalidate after each deploy.
        add_header Cache-Control "no-cache";
    }
    location / { return 404; }

    gzip on;
    gzip_types text/javascript application/javascript text/css;
}
